name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── macOS arm64 (Apple Silicon) ────────────────────────────────
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build
        run: |
          mkdir build_ci && cd build_ci
          ${{ env.QT_ROOT_DIR }}/bin/qmake ../src/rthextion.pro CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS=arm64
          make -j$(sysctl -n hw.logicalcpu)

      - name: Install DMG packager
        run: brew install create-dmg

      - name: Package DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          ${{ env.QT_ROOT_DIR }}/bin/macdeployqt build_ci/RTHextion.app
          xattr -cr build_ci/RTHextion.app

          if [ -n "${MACOS_SIGN_IDENTITY}" ]; then
            echo "Signing app with Developer ID: ${MACOS_SIGN_IDENTITY}"
            codesign --force --deep --options runtime --sign "${MACOS_SIGN_IDENTITY}" build_ci/RTHextion.app
            codesign --verify --deep --strict --verbose=2 build_ci/RTHextion.app
          else
            echo "No Developer ID — ad-hoc signing"
            codesign --force --deep --sign - build_ci/RTHextion.app
          fi

          mkdir -p dmg_root
          cp -R build_ci/RTHextion.app dmg_root/
          create-dmg \
            --volname "RTHextion" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 110 \
            --icon "RTHextion.app" 220 190 \
            --hide-extension "RTHextion.app" \
            --app-drop-link 580 190 \
            "RTHextion-macOS-arm64.dmg" \
            "dmg_root/"

          if [ -n "${MACOS_SIGN_IDENTITY}" ] && [ -n "${MACOS_NOTARY_APPLE_ID}" ] && [ -n "${MACOS_NOTARY_TEAM_ID}" ] && [ -n "${MACOS_NOTARY_PASSWORD}" ]; then
            echo "Submitting DMG for notarization"
            xcrun notarytool submit "RTHextion-macOS-arm64.dmg" \
              --apple-id "${MACOS_NOTARY_APPLE_ID}" \
              --team-id "${MACOS_NOTARY_TEAM_ID}" \
              --password "${MACOS_NOTARY_PASSWORD}" \
              --wait
            xcrun stapler staple "RTHextion-macOS-arm64.dmg"
          else
            echo "Notarization secrets are not fully set; skipping notarization"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTHextion-macOS-arm64
          path: RTHextion-macOS-arm64.dmg

  # ─── macOS x86_64 (Intel) ────────────────────────────────────────
  build-macos-x86_64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build
        run: |
          mkdir build_ci && cd build_ci
          ${{ env.QT_ROOT_DIR }}/bin/qmake ../src/rthextion.pro CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS=x86_64
          make -j$(sysctl -n hw.logicalcpu)

      - name: Install DMG packager
        run: brew install create-dmg

      - name: Package DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          ${{ env.QT_ROOT_DIR }}/bin/macdeployqt build_ci/RTHextion.app
          xattr -cr build_ci/RTHextion.app

          if [ -n "${MACOS_SIGN_IDENTITY}" ]; then
            echo "Signing app with Developer ID: ${MACOS_SIGN_IDENTITY}"
            codesign --force --deep --options runtime --sign "${MACOS_SIGN_IDENTITY}" build_ci/RTHextion.app
            codesign --verify --deep --strict --verbose=2 build_ci/RTHextion.app
          else
            echo "No Developer ID — ad-hoc signing"
            codesign --force --deep --sign - build_ci/RTHextion.app
          fi

          mkdir -p dmg_root
          cp -R build_ci/RTHextion.app dmg_root/
          create-dmg \
            --volname "RTHextion" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 110 \
            --icon "RTHextion.app" 220 190 \
            --hide-extension "RTHextion.app" \
            --app-drop-link 580 190 \
            "RTHextion-macOS-x86_64.dmg" \
            "dmg_root/"

          if [ -n "${MACOS_SIGN_IDENTITY}" ] && [ -n "${MACOS_NOTARY_APPLE_ID}" ] && [ -n "${MACOS_NOTARY_TEAM_ID}" ] && [ -n "${MACOS_NOTARY_PASSWORD}" ]; then
            echo "Submitting DMG for notarization"
            xcrun notarytool submit "RTHextion-macOS-x86_64.dmg" \
              --apple-id "${MACOS_NOTARY_APPLE_ID}" \
              --team-id "${MACOS_NOTARY_TEAM_ID}" \
              --password "${MACOS_NOTARY_PASSWORD}" \
              --wait
            xcrun stapler staple "RTHextion-macOS-x86_64.dmg"
          else
            echo "Notarization secrets are not fully set; skipping notarization"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTHextion-macOS-x86_64
          path: RTHextion-macOS-x86_64.dmg

  # ─── Windows x64 (MSVC) ──────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Cache libiconv (vcpkg)
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:/vcpkg/installed/x64-windows-static
          key: vcpkg-libiconv-x64-windows-static-${{ hashFiles('C:/vcpkg/versions/l-/libiconv.json') }}
          restore-keys: vcpkg-libiconv-x64-windows-static-

      - name: Install libiconv (vcpkg)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: vcpkg install libiconv:x64-windows-static
        shell: cmd

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build_ci
          cd build_ci
          "%QT_ROOT_DIR%\bin\qmake" ..\src\rthextion.pro CONFIG+=release ^
            "INCLUDEPATH+=C:/vcpkg/installed/x64-windows-static/include" ^
            "LIBS+=C:/vcpkg/installed/x64-windows-static/lib/iconv.lib"
          nmake

      - name: Deploy Qt dependencies
        shell: cmd
        run: |
          mkdir RTHextion-Windows
          copy build_ci\release\RTHextion.exe RTHextion-Windows\
          "%QT_ROOT_DIR%\bin\windeployqt" --release --no-translations RTHextion-Windows\RTHextion.exe

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path RTHextion-Windows\* -DestinationPath RTHextion-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTHextion-Windows-x64
          path: RTHextion-Windows-x64.zip

  # ─── Windows x86 (MSVC, patched Qt 6) ───────────────────────────
  build-windows-x86:
    runs-on: windows-2022
    env:
      QT_X86_ROOT: C:/Qt/6.8.4-msvc2022-x86
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: '14.4'
          vsversion: '2022'

      - name: Record MSVC toolset version
        id: msvc-toolset
        shell: pwsh
        run: |
          if (-not $env:VCToolsVersion) {
            throw 'VCToolsVersion was not set by the MSVC developer environment.'
          }
          if ($env:VisualStudioVersion -notlike '17.*') {
            throw "Expected Visual Studio 2022 (17.x), got '$($env:VisualStudioVersion)'."
          }
          if ($env:VCToolsVersion -notlike '14.4*') {
            throw "Expected the Visual Studio 2022 14.4x toolset, got '$($env:VCToolsVersion)'."
          }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x86') {
            throw "Expected the MSVC x86 target environment, got '$($env:VSCMD_ARG_TGT_ARCH)'."
          }
          "version=$($env:VCToolsVersion.TrimEnd('\'))" >> $env:GITHUB_OUTPUT

      - name: Cache patched Qt 6.8.4 x86 SDK
        uses: actions/cache@v4
        id: qt-x86-cache
        with:
          path: C:/Qt/6.8.4-msvc2022-x86
          key: qt-6.8.4-qt6windows7-ec37b996779b13c4dd0b7cc1fbd3db288bdde9b1-msvc-${{ steps.msvc-toolset.outputs.version }}-x86-release-shared-desktop-opengl-no-sql-drivers-qtbase-v4

      - name: Build patched Qt 6.8.4 x86 SDK
        if: steps.qt-x86-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # Reference configuration:
          # https://github.com/crystalidea/qt-build-tools/tree/447927451bf54977fb3bc080b5adf69f85ccfe81/6.8.4
          $qtVersion = '6.8.4'
          $qtSourceSha256 = 'db96e53f1b6022ccffd9344701874058b207046e8fb4dbde3cacc2a5602ad123'
          $backportRevision = 'ec37b996779b13c4dd0b7cc1fbd3db288bdde9b1'
          $workRoot = Join-Path $env:RUNNER_TEMP 'qt6windows7-x86-build'
          $sourceArchive = Join-Path $workRoot "qtbase-everywhere-opensource-src-$qtVersion.zip"
          $backportArchive = Join-Path $workRoot "qt6windows7-$backportRevision.zip"

          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x86') {
            throw "Expected the MSVC x86 environment, got '$($env:VSCMD_ARG_TGT_ARCH)'."
          }
          foreach ($command in @('cl.exe', 'cmake.exe', 'ninja.exe', 'python.exe', 'robocopy.exe')) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required build command '$command' was not found."
            }
          }
          if (Test-Path -LiteralPath $env:QT_X86_ROOT) {
            throw "Unexpected existing Qt install on a cache miss: $env:QT_X86_ROOT"
          }

          New-Item -ItemType Directory -Path $workRoot -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://download.qt.io/official_releases/qt/6.8/$qtVersion/submodules/qtbase-everywhere-opensource-src-$qtVersion.zip" `
            -OutFile $sourceArchive
          $actualHash = (Get-FileHash -LiteralPath $sourceArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $qtSourceSha256) {
            throw "Qt source SHA-256 mismatch. Expected $qtSourceSha256, got $actualHash."
          }

          Invoke-WebRequest `
            -Uri "https://github.com/crystalidea/qt6windows7/archive/$backportRevision.zip" `
            -OutFile $backportArchive
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $workRoot
          Expand-Archive -LiteralPath $backportArchive -DestinationPath $workRoot

          $sourceDirectory = Get-ChildItem -LiteralPath $workRoot -Directory |
            Where-Object Name -Like 'qtbase-everywhere-*-6.8.4' |
            Select-Object -First 1
          $backportDirectory = Get-ChildItem -LiteralPath $workRoot -Directory |
            Where-Object Name -Like 'qt6windows7-*' |
            Select-Object -First 1
          if (-not $sourceDirectory -or -not $backportDirectory) {
            throw 'Could not locate the extracted Qt source or qt6windows7 backport.'
          }

          # qt6windows7 documents qtbase as an overlay on the stock source.
          $qtbaseOverlay = Join-Path $backportDirectory.FullName 'qtbase'
          & robocopy.exe $qtbaseOverlay $sourceDirectory.FullName /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) {
            throw "Applying the qt6windows7 overlay failed with exit code $LASTEXITCODE."
          }

          $buildDirectory = Join-Path $workRoot 'build-qtbase-x86-release'
          New-Item -ItemType Directory -Path $buildDirectory | Out-Null
          Push-Location $buildDirectory
          try {
            & (Join-Path $sourceDirectory.FullName 'configure.bat') `
              -prefix $env:QT_X86_ROOT `
              -release `
              -opensource `
              -confirm-license `
              -opengl desktop `
              -no-openssl `
              -nomake tests `
              -nomake examples `
              -cmake-generator Ninja `
              -- `
              -DFEATURE_sql_db2=OFF `
              -DFEATURE_sql_ibase=OFF `
              -DFEATURE_sql_firebird=OFF `
              -DFEATURE_sql_mysql=OFF `
              -DFEATURE_sql_oci=OFF `
              -DFEATURE_sql_odbc=OFF `
              -DFEATURE_sql_psql=OFF `
              -DFEATURE_sql_sqlite=OFF `
              -DFEATURE_sql_mimer=OFF
            if ($LASTEXITCODE -ne 0) {
              throw "Qt configure failed with exit code $LASTEXITCODE."
            }
            & cmake.exe --build . --parallel
            if ($LASTEXITCODE -ne 0) {
              throw "Qt build failed with exit code $LASTEXITCODE."
            }
            & cmake.exe --install . --config Release
            if ($LASTEXITCODE -ne 0) {
              throw "Qt install failed with exit code $LASTEXITCODE."
            }
          } finally {
            Pop-Location
          }

      - name: Validate selected x86 Qt SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-PeMachine([string]$Path) {
            $stream = [IO.File]::OpenRead($Path)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5a4d) { throw "Missing MZ header: $Path" }
              $stream.Position = 0x3c
              $stream.Position = $reader.ReadUInt32()
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Missing PE signature: $Path" }
              return $reader.ReadUInt16()
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }

          $qmake = Join-Path $env:QT_X86_ROOT 'bin/qmake.exe'
          $deploy = Join-Path $env:QT_X86_ROOT 'bin/windeployqt.exe'
          $requiredSdkPeFiles = @(
            $qmake,
            $deploy,
            (Join-Path $env:QT_X86_ROOT 'bin/moc.exe'),
            (Join-Path $env:QT_X86_ROOT 'bin/uic.exe'),
            (Join-Path $env:QT_X86_ROOT 'bin/rcc.exe'),
            (Join-Path $env:QT_X86_ROOT 'bin/Qt6Core.dll'),
            (Join-Path $env:QT_X86_ROOT 'bin/Qt6Gui.dll'),
            (Join-Path $env:QT_X86_ROOT 'bin/Qt6Widgets.dll'),
            (Join-Path $env:QT_X86_ROOT 'bin/Qt6Concurrent.dll'),
            (Join-Path $env:QT_X86_ROOT 'plugins/platforms/qwindows.dll')
          )
          $requiredSdkFiles = $requiredSdkPeFiles + @(
            (Join-Path $env:QT_X86_ROOT 'include/QtCore/qglobal.h'),
            (Join-Path $env:QT_X86_ROOT 'lib/Qt6Core.lib')
          )
          foreach ($file in $requiredSdkFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Cached Qt SDK is incomplete; missing $file"
            }
          }
          & $qmake -v
          if ((& $qmake -query QT_VERSION).Trim() -ne '6.8.4') {
            throw 'The selected x86 qmake is not Qt 6.8.4.'
          }
          foreach ($file in $requiredSdkPeFiles) {
            $machine = Get-PeMachine $file
            Write-Host ('{0}: 0x{1:x4}' -f $file, $machine)
            if ($machine -ne 0x014c) {
              throw "Qt SDK file is not x86 / IMAGE_FILE_MACHINE_I386: $file"
            }
          }

      - name: Record vcpkg libiconv port version
        id: vcpkg-libiconv
        shell: pwsh
        run: |
          $portVersionFile = 'C:/vcpkg/versions/l-/libiconv.json'
          if (-not (Test-Path -LiteralPath $portVersionFile -PathType Leaf)) {
            throw "vcpkg libiconv version file is missing: $portVersionFile"
          }
          $hash = (Get-FileHash -LiteralPath $portVersionFile -Algorithm SHA256).Hash.ToLowerInvariant()
          "port-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache libiconv x86 (vcpkg)
        uses: actions/cache@v4
        id: vcpkg-x86-cache
        with:
          path: C:/vcpkg/installed/x86-windows-static
          key: vcpkg-libiconv-${{ steps.vcpkg-libiconv.outputs.port-hash }}-msvc-${{ steps.msvc-toolset.outputs.version }}-x86-windows-static-v1

      - name: Install libiconv x86 (vcpkg)
        if: steps.vcpkg-x86-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\vcpkg\vcpkg.exe install libiconv:x86-windows-static

      - name: Validate x86 libiconv installation
        shell: pwsh
        run: |
          foreach ($file in @(
            'C:/vcpkg/installed/x86-windows-static/include/iconv.h',
            'C:/vcpkg/installed/x86-windows-static/lib/iconv.lib'
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "The x86 libiconv installation is incomplete; missing $file"
            }
          }

      - name: Build native x86 application
        shell: cmd
        run: |
          mkdir build_ci_x86
          cd build_ci_x86
          "%QT_X86_ROOT%\bin\qmake.exe" ..\src\rthextion.pro CONFIG+=release ^
            "INCLUDEPATH+=C:/vcpkg/installed/x86-windows-static/include" ^
            "LIBS+=C:/vcpkg/installed/x86-windows-static/lib/iconv.lib"
          if errorlevel 1 exit /b %errorlevel%
          nmake

      - name: Deploy x86 Qt and MSVC dependencies
        shell: cmd
        run: |
          mkdir RTHextion-Windows-x86
          copy build_ci_x86\release\RTHextion.exe RTHextion-Windows-x86\
          if errorlevel 1 exit /b %errorlevel%
          "%QT_X86_ROOT%\bin\windeployqt.exe" --release --no-translations --compiler-runtime RTHextion-Windows-x86\RTHextion.exe
          if errorlevel 1 exit /b %errorlevel%
          copy /Y "%QT_X86_ROOT%\bin\Qt6Concurrent.dll" RTHextion-Windows-x86\

      - name: Verify every deployed PE file is x86
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path -LiteralPath 'RTHextion-Windows-x86').Path
          $required = @(
            'RTHextion.exe',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'Qt6Concurrent.dll',
            'platforms/qwindows.dll'
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relativePath) -PathType Leaf)) {
              throw "Required deployed binary is missing: $relativePath"
            }
          }

          function Get-PeMachine([string]$Path) {
            $stream = [IO.File]::OpenRead($Path)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5a4d) { throw "Missing MZ header: $Path" }
              $stream.Position = 0x3c
              $stream.Position = $reader.ReadUInt32()
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Missing PE signature: $Path" }
              return $reader.ReadUInt16()
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }

          $peFiles = @(Get-ChildItem -LiteralPath $root -Recurse -File |
            Where-Object Extension -In @('.exe', '.dll'))
          if (-not $peFiles) { throw 'No deployed PE files were found.' }
          $wrongArchitecture = @()
          foreach ($file in $peFiles) {
            $machine = Get-PeMachine $file.FullName
            $relativeName = [IO.Path]::GetRelativePath($root, $file.FullName)
            Write-Host ('{0,-70} 0x{1:x4}' -f $relativeName, $machine)
            if ($machine -ne 0x014c) {
              $wrongArchitecture += "$relativeName (0x$($machine.ToString('x4')))"
            }
          }
          if ($wrongArchitecture.Count -gt 0) {
            throw "Non-x86 PE files were deployed: $($wrongArchitecture -join ', ')"
          }

      - name: Smoke test deployed x86 application
        shell: pwsh
        run: |
          Push-Location RTHextion-Windows-x86
          try {
            $executable = Join-Path (Get-Location) 'RTHextion.exe'
            $process = Start-Process -FilePath $executable -ArgumentList '--help' -PassThru -NoNewWindow
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force
              throw 'RTHextion x86 smoke test timed out after 30 seconds.'
            }
            if ($process.ExitCode -ne 0) {
              throw "RTHextion x86 smoke test failed with exit code $($process.ExitCode)."
            }
          } finally {
            Pop-Location
          }

      - name: Create x86 ZIP
        shell: pwsh
        run: Compress-Archive -Path RTHextion-Windows-x86\* -DestinationPath RTHextion-Windows-x86.zip

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTHextion-Windows-x86
          path: RTHextion-Windows-x86.zip

  # ─── Linux x86_64 (AppImage) ─────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev-tools qt6-l10n-tools \
            clang \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype6-dev libxrender-dev \
            libxext-dev libx11-dev libxcb1-dev \
            libfuse2 imagemagick

      - name: Build
        run: |
          if command -v qmake6 >/dev/null 2>&1; then
            QMAKE_BIN="$(command -v qmake6)"
          elif [ -x "/usr/lib/qt6/bin/qmake" ]; then
            QMAKE_BIN="/usr/lib/qt6/bin/qmake"
          elif [ -x "/usr/lib/qt6/bin/qmake6" ]; then
            QMAKE_BIN="/usr/lib/qt6/bin/qmake6"
          else
            echo "qmake (Qt6) not found"
            find /usr -name 'qmake*' 2>/dev/null || true
            exit 1
          fi

          echo "Using qmake: $QMAKE_BIN"
          "$QMAKE_BIN" -v
          mkdir build_ci && cd build_ci
          "$QMAKE_BIN" ../src/rthextion.pro CONFIG+=release QMAKE_CC=clang QMAKE_CXX=clang++
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Prepare AppImage resources
        run: |
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=RTHextion' \
            'Exec=RTHextion' \
            'Icon=RTHextion' \
            'Type=Application' \
            'Categories=Utility;' \
            > RTHextion.desktop
          convert src/images/tj.png -resize 256x256 RTHextion.png

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage appimagetool-x86_64.AppImage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euxo pipefail
          # Find qmake for the Qt plugin
          if command -v qmake6 >/dev/null 2>&1; then
            export QMAKE="$(command -v qmake6)"
          elif [ -x "/usr/lib/qt6/bin/qmake" ]; then
            export QMAKE="/usr/lib/qt6/bin/qmake"
          fi
          echo "QMAKE=$QMAKE"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build_ci/RTHextion \
            --desktop-file RTHextion.desktop \
            --icon-file RTHextion.png \
            --plugin qt \
            --output appimage || {
              echo "linuxdeploy --output appimage failed; retrying via appdir + appimagetool"
              ./linuxdeploy-x86_64.AppImage \
                --appdir AppDir \
                --executable build_ci/RTHextion \
                --desktop-file RTHextion.desktop \
                --icon-file RTHextion.png \
                --plugin qt \
                --output appdir
              ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir RTHextion-Linux-x86_64.AppImage
            }

      - name: Prepare AppImage artifact
        run: |
          mv RTHextion-*.AppImage RTHextion-Linux-x86_64.AppImage 2>/dev/null \
            || mv RTHextion*.AppImage RTHextion-Linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTHextion-Linux-x86_64
          path: RTHextion-Linux-x86_64.AppImage

  # ─── Linux arm64 (AppImage) ──────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev-tools qt6-l10n-tools \
            clang \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype6-dev libxrender-dev \
            libxext-dev libx11-dev libxcb1-dev \
            libfuse2 imagemagick

      - name: Build
        run: |
          if command -v qmake6 >/dev/null 2>&1; then
            QMAKE_BIN="$(command -v qmake6)"
          elif [ -x "/usr/lib/qt6/bin/qmake" ]; then
            QMAKE_BIN="/usr/lib/qt6/bin/qmake"
          elif [ -x "/usr/lib/qt6/bin/qmake6" ]; then
            QMAKE_BIN="/usr/lib/qt6/bin/qmake6"
          else
            echo "qmake (Qt6) not found"
            exit 1
          fi

          mkdir build_ci && cd build_ci
          "$QMAKE_BIN" ../src/rthextion.pro CONFIG+=release QMAKE_CC=clang QMAKE_CXX=clang++
          make -j$(nproc)

      - name: Prepare AppImage resources
        run: |
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=RTHextion' \
            'Exec=RTHextion' \
            'Icon=RTHextion' \
            'Type=Application' \
            'Categories=Utility;' \
            > RTHextion.desktop
          convert src/images/tj.png -resize 256x256 RTHextion.png

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-qt-aarch64.AppImage appimagetool-aarch64.AppImage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euxo pipefail
          if command -v qmake6 >/dev/null 2>&1; then
            export QMAKE="$(command -v qmake6)"
          elif [ -x "/usr/lib/qt6/bin/qmake" ]; then
            export QMAKE="/usr/lib/qt6/bin/qmake"
          fi
          echo "QMAKE=$QMAKE"

          ./linuxdeploy-aarch64.AppImage \
            --appdir AppDir \
            --executable build_ci/RTHextion \
            --desktop-file RTHextion.desktop \
            --icon-file RTHextion.png \
            --plugin qt \
            --output appimage || {
              echo "linuxdeploy --output appimage failed; retrying via appdir + appimagetool"
              ./linuxdeploy-aarch64.AppImage \
                --appdir AppDir \
                --executable build_ci/RTHextion \
                --desktop-file RTHextion.desktop \
                --icon-file RTHextion.png \
                --plugin qt \
                --output appdir
              ARCH=aarch64 ./appimagetool-aarch64.AppImage AppDir RTHextion-Linux-arm64.AppImage
            }

      - name: Prepare AppImage artifact
        run: |
          mv RTHextion-*.AppImage RTHextion-Linux-arm64.AppImage 2>/dev/null \
            || mv RTHextion*.AppImage RTHextion-Linux-arm64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTHextion-Linux-arm64
          path: RTHextion-Linux-arm64.AppImage

  # ─── Create GitHub Release ───────────────────────────────────────
  release:
    needs: [build-macos-arm64, build-macos-x86_64, build-windows, build-windows-x86, build-linux-x86_64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/RTHextion-macOS-arm64/RTHextion-macOS-arm64.dmg
            artifacts/RTHextion-macOS-x86_64/RTHextion-macOS-x86_64.dmg
            artifacts/RTHextion-Windows-x64/RTHextion-Windows-x64.zip
            artifacts/RTHextion-Windows-x86/RTHextion-Windows-x86.zip
            artifacts/RTHextion-Linux-x86_64/RTHextion-Linux-x86_64.AppImage
            artifacts/RTHextion-Linux-arm64/RTHextion-Linux-arm64.AppImage
